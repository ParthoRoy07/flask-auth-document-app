<!DOCTYPE html>
<html>
<head>
    <title>AI Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="ai-body">

    <div class="ai-sidebar">
        <h2 class="logo">Vision<span>UI</span></h2>
        <ul>
            <li><a href="/dashboard" class="active">🏠 Dashboard</a></li>
            <li><a href="/grades">📊 Grades</a></li>
            <li><a href="/reset">🔐 Reset Password</a></li>
            <li><a href="/logout">🚪 Logout</a></li>
        </ul>
    </div>

    <div class="ai-main">
        <div class="ai-header">
            <h1>Welcome back, {{ username }} 👋</h1>
            <p>Student Performance Overview</p>
        </div>

        <div class="ai-cards">

            <div class="ai-card glow-blue">
                <h3>Total Subjects</h3>
                <p>3</p>
            </div>

            <div class="ai-card glow-purple">
                <h3>Average Score</h3>
                <p>84%</p>
            </div>

            <div class="ai-card glow-green">
                <h3>Status</h3>
                <p>Excellent</p>
            </div>

        </div>

    </div>

</body>
</html>
